# Render Blueprint. 리포지토리 루트에 두고 "New + > Blueprint" 로 배포하세요.
services:
  - type: web
    name: enertel-forecast-loader
    runtime: docker
    plan: starter          # 고정 아웃바운드 IP(Azure 방화벽 허용)를 쓰려면 유료 플랜 필요
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENERTEL_API_TOKEN
        sync: false          # 대시보드에서 직접 입력(비밀)
      - key: LAI_PASSWORD
        sync: false          # 대시보드에서 직접 입력(비밀)
      - key: RUN_API_KEY
        sync: false          # n8n 호출 인증용 임의 문자열
      - key: LAI_SERVER
        value: skes-dewblaine.database.windows.net
      - key: LAI_DATABASE
        value: LAI
      - key: LAI_USERNAME
        value: LAI_readwr
      - key: LAI_TABLE
        value: dbo.GM_Power_Enertel_Forecast
      - key: NODE
        value: LZ_HOUSTON
      - key: ISO
        value: ERCOT
